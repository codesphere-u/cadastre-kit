[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "cadastre-kit"
version = "0.1.0"
description = "Zero-dependency ISO 19152 LADM parcel topology validator, ear-clipping overlap & sliver detector, subdivision conservation auditor, and neighbor-witness attestation ledger."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Akandwanaho Ivan Alvin" }]
keywords = [
    "cadastre",
    "iso-19152",
    "ladm",
    "land-rights",
    "computational-geometry",
    "gis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.scripts]
cadastre-kit = "cadastre_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cadastre_kit"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
